apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: sample-web
  labels:
    app.kubernetes.io/name: sample-web
    app.kubernetes.io/part-of: single-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-web
        app.kubernetes.io/part-of: single-cluster
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: index
          configMap:
            name: sample-web-index
