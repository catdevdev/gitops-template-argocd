apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-web-index
  namespace: sample-web
  labels:
    app.kubernetes.io/name: sample-web
    app.kubernetes.io/part-of: single-cluster
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>sample-web</title>
      </head>
      <body>
        <h1>sample-web</h1>
        <p>This app is managed by Argo CD from a single-cluster GitOps repository.</p>
      </body>
    </html>
